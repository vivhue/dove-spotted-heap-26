<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Worker Prototype</title>
    <style>
      body {
        background: #f6f1e8;
        color: #2b2118;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 40px;
      }

      main {
        background: #fffdf9;
        border: 1px solid #dfd2bf;
        border-radius: 8px;
        max-width: 520px;
        padding: 28px;
      }

      h1 {
        font-family: Georgia, serif;
        font-size: 28px;
        margin: 0 0 10px;
      }

      p {
        color: #8f806b;
        line-height: 1.5;
        margin: 0 0 22px;
      }

      input {
        display: block;
        margin-bottom: 18px;
      }

      button {
        background: #2b2118;
        border: 0;
        border-radius: 8px;
        color: #fff8ea;
        cursor: pointer;
        font-weight: 700;
        padding: 12px 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Image to 3D Worker</h1>
      <p>This is isolated from the main app. It saves an image and returns a mock 3D job for now.</p>

      <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="image" accept="image/*" required>
        <button type="submit">Create Mock 3D Job</button>
      </form>
    </main>
  </body>
</html>
