<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BoveCloset 3D Avatar Prototype</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body class="body-focus">
    <main class="shell">
      <section class="workspace" aria-label="3D avatar preview">
        <div class="topbar">
          <div>
            <p class="eyebrow">BoveCloset body study</p>
            <h1>Body model prototype</h1>
          </div>
          <div class="status" id="statusText">Body proportions only</div>
        </div>
        <div class="viewport-wrap">
          <canvas id="avatarCanvas" aria-label="Interactive 3D avatar model"></canvas>
        </div>
        <div class="hint-row">
          <span>Drag to rotate</span>
          <span>Scroll to zoom</span>
          <span>Body measurements are in centimeters</span>
        </div>
      </section>

      <aside class="panel" aria-label="Avatar customization controls">
        <div class="panel-header">
          <p class="eyebrow">Build controls</p>
          <h2>Customize model</h2>
        </div>

        <div class="tabs" role="tablist" aria-label="Control sections">
          <button class="tab active" type="button" data-tab="body">Body</button>
          <button class="tab" type="button" data-tab="clothes">Clothes</button>
          <button class="tab" type="button" data-tab="style">Style</button>
        </div>

        <form id="controls">
          <section class="tab-panel active" data-panel="body">
            <fieldset class="body-type" aria-label="Body type">
              <legend>Body type</legend>
              <label>
                <input type="radio" name="bodyType" value="female" checked>
                <span>Female</span>
              </label>
              <label>
                <input type="radio" name="bodyType" value="male">
                <span>Male</span>
              </label>
            </fieldset>
            <div class="measurement" data-measure="height">
              <div class="measure-head">
                <label for="heightValue">Height</label>
                <div class="number-unit">
                  <input id="heightValue" type="number" min="145" max="205" step="1" value="170">
                  <span>cm</span>
                </div>
              </div>
              <input id="heightRange" type="range" min="145" max="205" step="1" value="170">
            </div>
            <div class="measurement" data-measure="build">
              <div class="measure-head">
                <label for="buildValue">Build</label>
                <div class="number-unit">
                  <input id="buildValue" type="number" min="80" max="120" step="1" value="100">
                  <span>%</span>
                </div>
              </div>
              <input id="buildRange" type="range" min="80" max="120" step="1" value="100">
            </div>
            <div class="measurement" data-measure="chest">
              <div class="measure-head">
                <label for="chestValue">Chest</label>
                <div class="number-unit">
                  <input id="chestValue" type="number" min="72" max="125" step="1" value="92">
                  <span>cm</span>
                </div>
              </div>
              <input id="chestRange" type="range" min="72" max="125" step="1" value="92">
            </div>
            <div class="measurement" data-measure="waist">
              <div class="measure-head">
                <label for="waistValue">Waist</label>
                <div class="number-unit">
                  <input id="waistValue" type="number" min="55" max="115" step="1" value="76">
                  <span>cm</span>
                </div>
              </div>
              <input id="waistRange" type="range" min="55" max="115" step="1" value="76">
            </div>
            <div class="measurement" data-measure="hips">
              <div class="measure-head">
                <label for="hipsValue">Hips</label>
                <div class="number-unit">
                  <input id="hipsValue" type="number" min="70" max="130" step="1" value="96">
                  <span>cm</span>
                </div>
              </div>
              <input id="hipsRange" type="range" min="70" max="130" step="1" value="96">
            </div>
            <div class="measurement" data-measure="shoulders">
              <div class="measure-head">
                <label for="shouldersValue">Shoulder width</label>
                <div class="number-unit">
                  <input id="shouldersValue" type="number" min="34" max="55" step="1" value="43">
                  <span>cm</span>
                </div>
              </div>
              <input id="shouldersRange" type="range" min="34" max="55" step="1" value="43">
            </div>
            <div class="measurement" data-measure="inseam">
              <div class="measure-head">
                <label for="inseamValue">Inseam</label>
                <div class="number-unit">
                  <input id="inseamValue" type="number" min="62" max="95" step="1" value="76">
                  <span>cm</span>
                </div>
              </div>
              <input id="inseamRange" type="range" min="62" max="95" step="1" value="76">
            </div>
            <div class="measurement" data-measure="arm">
              <div class="measure-head">
                <label for="armValue">Arm length</label>
                <div class="number-unit">
                  <input id="armValue" type="number" min="48" max="72" step="1" value="60">
                  <span>cm</span>
                </div>
              </div>
              <input id="armRange" type="range" min="48" max="72" step="1" value="60">
            </div>
          </section>

          <section class="tab-panel" data-panel="clothes">
            <label class="field">
              <span>Top</span>
              <select id="topType">
                <option value="tee">T-shirt</option>
                <option value="shirt">Button shirt</option>
                <option value="tank">Tank top</option>
                <option value="none">None</option>
              </select>
            </label>
            <label class="field">
              <span>Layer</span>
              <select id="layerType">
                <option value="none">None</option>
                <option value="jacket">Cropped jacket</option>
                <option value="cardigan">Soft cardigan</option>
              </select>
            </label>
            <label class="field">
              <span>Bottom</span>
              <select id="bottomType">
                <option value="trousers">Trousers</option>
                <option value="jeans">Jeans</option>
                <option value="shorts">Shorts</option>
                <option value="skirt">Skirt</option>
              </select>
            </label>
            <label class="field">
              <span>Dress</span>
              <select id="dressType">
                <option value="none">None</option>
                <option value="mini">Mini dress</option>
                <option value="midi">Midi dress</option>
              </select>
            </label>
            <label class="check">
              <input id="shoes" type="checkbox" checked>
              <span>Shoes</span>
            </label>
            <label class="check">
              <input id="hat" type="checkbox">
              <span>Cap</span>
            </label>
          </section>

          <section class="tab-panel" data-panel="style">
            <label class="field">
              <span>Outfit preset</span>
              <select id="preset">
                <option value="smart">Smart casual</option>
                <option value="street">Streetwear</option>
                <option value="cny">CNY dinner</option>
                <option value="date">First date</option>
                <option value="interview">Job interview</option>
              </select>
            </label>

            <div class="swatches" aria-label="Color controls">
              <label>
                <span>Skin</span>
                <input id="skinColor" type="color" value="#b8794f">
              </label>
              <label>
                <span>Top</span>
                <input id="topColor" type="color" value="#f7f0e6">
              </label>
              <label>
                <span>Bottom</span>
                <input id="bottomColor" type="color" value="#2f465f">
              </label>
              <label>
                <span>Layer</span>
                <input id="layerColor" type="color" value="#2b2d42">
              </label>
            </div>

            <button class="primary" id="surpriseBtn" type="button">Surprise me</button>
          </section>
        </form>
      </aside>
    </main>

    <script src="src/app.js"></script>
  </body>
</html>
