services:
  - type: web
    name: bovecloset-api
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: MAX_UPLOAD_MB
        value: "15"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: PRESIGN_EXPIRES_SECONDS
        value: "604800"
      - key: BG_REMOVAL_MODEL
        value: isnet-general-use
      - key: IDM_VTON_SPACE
        value: yisol/IDM-VTON
      - key: APP_DB_PATH
        value: ./data/app.db
